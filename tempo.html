<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tempo - Isso Aquilo</title>
  <link rel="stylesheet" href="jogo.css">
</head>
<body>
  <img src="images/logo.svg" alt="Isso Aquilo">

  <!-- As duas curiosidades (botões) e, embaixo, o tempo de cada uma (os <p>) -->
  <div id="opcoes">   <!-- caixa que guarda tudo; "opcoes" é o nome (id) dela -->
    <button></button> <!-- cartão da curiosidade A (o JS escreve o texto aqui) -->
    <button></button> <!-- cartão da curiosidade B -->
    <p hidden></p>    <!-- texto do tempo/número da A, escondido até o clique -->
    <p hidden></p>    <!-- texto do tempo/número da B -->
  </div>

  <p id="resultado"></p>
  <button id="proxima" hidden>Próxima</button>

  <!-- Tela final: ficam escondidos até acabar a 5ª pergunta -->
  <p id="nota" hidden>0/5</p>
  <p id="rotulo" hidden>Pontuação</p>
  <a id="voltar" href="index.html" hidden>Voltar</a>

  <footer>Quiz desenvolvido por Nathan de Souza</footer>

  <script src="tempo.js"></script>
</body>
</html>
